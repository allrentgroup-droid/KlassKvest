<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>КлассКвест</title><style>body{margin:0;background:#eff7f3;color:#163d35;font:16px system-ui}header{background:#155b4c;color:white;padding:18px}main{max-width:850px;margin:auto;padding:16px}button,input,select,textarea{font:inherit;padding:12px;border-radius:10px;border:1px solid #aacbbd}button{cursor:pointer;background:#d5e9df;color:#164d40;margin:4px}button.primary{background:#167c65;color:white}nav{display:flex;overflow:auto}.card{background:white;border-radius:16px;padding:20px;margin:15px 0;box-shadow:0 2px 14px #153b2712}input,textarea,select{display:block;width:100%;box-sizing:border-box;margin:8px 0}label{display:block;margin:12px 0}.bar{height:16px;background:#d5e9df;border-radius:15px;overflow:hidden}.bar span{display:block;height:100%;background:#20a679}.muted{color:#6a7e76}.big{font-size:32px;font-weight:800}.answer{display:block;width:100%;text-align:left}</style><header><h2>🎒 КлассКвест · 6 «А»</h2>Наш класс — наша команда!</header><main><p class="muted">Демонстрационная версия. Данные сохраняются только на этом устройстве.</p><select id="role"><option value="student">👧 Ученик</option><option value="teacher">👩‍🏫 Учитель</option><option value="monitor">📋 Староста</option><option value="parent">👨‍👩‍👧 Родитель</option></select><nav id="nav"></nav><div id="app"></div><p class="muted">Игровые монеты не являются деньгами. В прототипе нет настоящей авторизации и синхронизации.</p></main><script>
const initial={goal:30000,coins:18750,done:[],tasks:[{id:1,subject:"Математика",q:"48 ÷ 6 + 7 × 3 = ?",options:["29","35","42"],correct:0,reward:40},{id:2,subject:"География",q:"Самый большой океан?",options:["Атлантический","Тихий","Индийский"],correct:1,reward:30},{id:3,subject:"Русский язык",q:"В каком слове пишется Ь?",options:["ноч..","врач..","плащ.."],correct:0,reward:30}],childVote:null,parentVote:null,approved:null};let s;try{s={...initial,...JSON.parse(localStorage.getItem("klassquest_v1")||"{}")}}catch{s=structuredClone(initial)}let tab="home",role="student";const $=id=>document.getElementById(id),safe=x=>String(x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),save=()=>localStorage.setItem("klassquest_v1",JSON.stringify(s));const events=[["cinema","🎬 Кинотеатр"],["quest","🧩 Квест-комната"],["bowling","🎳 Боулинг"],["park","🤸 Батутный парк"]];function go(t){tab=t;render()}$("role").onchange=e=>{role=e.target.value;render()};function render(){const tabs=[["home","🏠 Копилка"],["tasks","📚 Задания"],["vote","🗳️ Голосование"],["class","👥 Мой класс"],["memories","📸 Приключения"]];$("nav").innerHTML=tabs.map(([id,label])=>'<button onclick="go(\''+id+'\')">'+label+'</button>').join("");if(tab==="home")home();if(tab==="tasks")tasks();if(tab==="vote")vote();if(tab==="class")$("app").innerHTML='<div class="card"><h2>👥 Мой класс</h2><p>25 учеников работают ради общей цели.</p><p>🤝 Командные задания и модерируемый чат появятся после подключения аккаунтов.</p><p>Точные координаты детей не показываются одноклассникам.</p></div>';if(tab==="memories")$("app").innerHTML='<div class="card"><h2>📸 Наши приключения</h2><p>Альбомы, фотографии и памятные видеоролики появятся после настройки защищённого хранилища и согласий родителей.</p><p>Выбранное мероприятие: '+safe(events.find(x=>x[0]===s.approved)?.[1]||"ещё не выбрано")+'</p></div>'}function home(){const p=Math.min(100,Math.round(s.coins/s.goal*100));$("app").innerHTML='<div class="card"><h2>🎯 Общая копилка класса</h2><div class="big">'+s.coins.toLocaleString("ru-RU")+' 🪙</div><p>Цель: '+s.goal.toLocaleString("ru-RU")+' монет · '+p+'%</p><div class="bar"><span style="width:'+p+'%"></span></div><p>'+(s.coins>=s.goal?"🎉 Цель достигнута!":"🤝 Каждое решённое задание приближает класс к приключению!")+'</p><button class="primary" onclick="go(\'tasks\')">Решать задания</button></div><div class="card"><h3>🗳️ Наше приключение</h3><p>'+safe(events.find(x=>x[0]===s.approved)?.[1]||"Голосование открыто")+'</p><button onclick="go(\'vote\')">Голосовать</button></div>'+(role==="parent"?'<div class="card"><h3>⚙️ Цель класса</h3><input type="number" id="goal" value="'+s.goal+'" min="100"><button onclick="setGoal()">Сохранить</button></div>':"")}function setGoal(){const v=Number($("goal").value);if(!Number.isInteger(v)||v<100||v>1000000)return alert("Укажи цель от 100 до 1 000 000");s.goal=v;save();render()}function tasks(){$("app").innerHTML='<div class="card"><h2>📚 Задания</h2><p>Монеты начисляются один раз за задание.</p></div>'+s.tasks.map(t=>'<div class="card"><b>'+safe(t.subject)+'</b> · '+(s.done.includes(t.id)?"✅ Выполнено":"+"+t.reward+" 🪙")+'<h3>'+safe(t.q)+'</h3>'+(s.done.includes(t.id)?"Молодец!":t.options.map((o,i)=>'<button class="answer" onclick="answer('+t.id+','+i+')">'+safe(o)+'</button>').join(""))+'</div>').join("")+((role==="teacher"||role==="monitor")?'<div class="card"><h3>➕ Новое задание</h3><label>Предмет<input id="subject"></label><label>Вопрос<textarea id="question"></textarea></label><label>Три варианта через ;<input id="opts" placeholder="96;86;106"></label><label>Номер правильного ответа<input type="number" id="correct" min="1" max="3" value="1"></label><button class="primary" onclick="addTask()">Добавить</button></div>':"")}function answer(id,i){const t=s.tasks.find(x=>x.id===id);if(!t||s.done.includes(id))return;if(i!==t.correct)return alert("Попробуй ещё! Подумай над решением.");s.done.push(id);s.coins+=t.reward;save();alert("🎉 Правильно! +"+t.reward+" монет в общую копилку");render()}function addTask(){const subject=$("subject").value.trim(),q=$("question").value.trim(),options=$("opts").value.split(";").map(x=>x.trim()),correct=Number($("correct").value)-1;if(!subject||!q||options.length!==3||options.some(x=>!x)||![0,1,2].includes(correct))return alert("Заполни все поля");s.tasks.push({id:Math.max(...s.tasks.map(x=>x.id))+1,subject,q,options,correct,reward:30});save();render()}function vote(){const parent=role==="parent",key=parent?"parentVote":"childVote";$("app").innerHTML='<div class="card"><h2>🗳️ '+(parent?"Голосование родителей":"Голосование детей")+'</h2><p>'+(parent?"Родители выбирают мероприятие с учётом бюджета и безопасности.":"Куда отправится наш класс?")+'</p>'+events.map(([id,name])=>'<p><button onclick="cast(\''+id+'\')">'+(s[key]===id?"✓ ":"")+name+'</button></p>').join("")+'<p class="muted">Демонстрация: один голос на роль и браузер.</p></div>'+(parent?'<div class="card"><h3>Утвердить мероприятие</h3><select id="approved">'+events.map(([id,name])=>'<option value="'+id+'" '+(s.approved===id?"selected":"")+'>'+name+'</option>').join("")+'</select><button class="primary" onclick="approve()">Утвердить</button></div>':"")}function cast(id){s[role==="parent"?"parentVote":"childVote"]=id;save();render()}function approve(){s.approved=$("approved").value;save();render()}render();
</script></html>
